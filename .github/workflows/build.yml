name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Test native API contracts
        run: dotnet run --project tests/NetEaseNEXT.Api.Checks -c Release
      # The private signing key remains on the maintainer's machine.
      - name: Build unsigned MSIX for CI validation
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: NetEaseNEXT-windows-x64
          path: |
            artifacts/win-x64
            artifacts/msix/*.unsigned.msix
